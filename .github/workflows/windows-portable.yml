name: Windows portable (nolivekit)
# Every push to nolivekit builds, packages and validates the portable ZIP and
# keeps it as a run artifact. Pushing a v* tag (on a nolivekit commit) also
# publishes the ZIP as a GitHub Release. The manual button only appears once
# this file exists on the default branch.
on:
  push:
    branches: [nolivekit]
    tags: ['v*']
    # Documentation-only commits do not change the package. Path filters are
    # not applied to tag pushes. windows-licenses.md ships as licenses/NOTICE.md.
    paths:
      - '**'
      - '!**.md'
      - 'docs/windows-licenses.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch supersedes a running build.
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  GSTREAMER_VERSION: 1.26.10
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags need history to prove they point into nolivekit.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      - name: Require nolivekit
        shell: powershell
        run: |
          $ref = '${{ github.ref }}'
          if ($ref -eq 'refs/heads/nolivekit') { exit 0 }
          if ($ref -notlike 'refs/tags/v*') { throw "Run this workflow on nolivekit or a v* tag, not $ref." }
          git fetch --no-tags origin nolivekit
          if ($LASTEXITCODE) { throw 'Cannot fetch nolivekit.' }
          git merge-base --is-ancestor HEAD FETCH_HEAD
          if ($LASTEXITCODE) { throw "Tag $ref does not point to a commit of nolivekit." }
      - name: Cache GStreamer installers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gstreamer-msi
          key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}
      - name: Install pinned official GStreamer Runtime and Development
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The Windows PowerShell 5.1 progress bar makes large downloads very slow.
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $version = $env:GSTREAMER_VERSION
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          # SHA-256 of the official installers of GSTREAMER_VERSION; update both together.
          $files = [ordered]@{
            "gstreamer-1.0-msvc-x86_64-$version.msi" = 'a863bf3faa49e9f33bd3cc42967b473482d4dc98655ed95cba1ac59f26fb0cfb'
            "gstreamer-1.0-devel-msvc-x86_64-$version.msi" = '8487a115fea3b0b0b4c55a9a413ad1adab0fe78f6681feedc60858a48613a121'
          }
          $cache = Join-Path $env:RUNNER_TEMP 'gstreamer-msi'
          $logs = Join-Path $env:RUNNER_TEMP 'gstreamer-logs'
          $null = New-Item -ItemType Directory -Force -Path $cache, $logs
          foreach ($entry in $files.GetEnumerator()) {
            $msi = Join-Path $cache $entry.Key
            # A truncated/corrupted download (seen on the runner for the ~390 MB
            # Development MSI) is discarded and fetched again.
            for ($attempt = 1; -not (Test-Path $msi) -or (Get-FileHash $msi -Algorithm SHA256).Hash -ne $entry.Value; $attempt++) {
              if (Test-Path $msi) {
                Write-Warning ("{0}: {1} bytes, SHA-256 {2} (expected {3}); downloading again" -f $entry.Key, (Get-Item $msi).Length, (Get-FileHash $msi -Algorithm SHA256).Hash, $entry.Value)
                Remove-Item $msi -Force
              }
              if ($attempt -gt 4) { throw "Download/checksum failed 4 times: $base/$($entry.Key)" }
              Write-Host "Downloading $($entry.Key) (attempt $attempt)"
              & "$env:SystemRoot\System32\curl.exe" --fail --location --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --output $msi "$base/$($entry.Key)"
              if ($LASTEXITCODE) { Write-Warning "curl exit code $LASTEXITCODE"; Remove-Item $msi -Force -ErrorAction SilentlyContinue; Start-Sleep 15 }
            }
            $log = Join-Path $logs "$($entry.Key).log"
            for ($attempt = 1; ; $attempt++) {
              Write-Host "Installing $($entry.Key) (attempt $attempt)"
              $p = [Diagnostics.Process]::Start('msiexec.exe', "/i `"$msi`" /qn /norestart /l*v `"$log`" INSTALLDIR=C:\gstreamer ADDLOCAL=ALL")
              $p.WaitForExit()
              $code = $p.ExitCode
              # 1618: another installation (e.g. on runner start-up) is in progress.
              if ($code -ne 1618 -or $attempt -ge 10) { break }
              Start-Sleep 30
            }
            if ($code -notin 0, 3010) {
              if (Test-Path $log) { Get-Content $log -Tail 80 | Write-Host }
              throw "msiexec failed for $($entry.Key) with exit code $code (full log: artifact gstreamer-install-logs)."
            }
          }
          # INSTALLDIR is the C:\gstreamer root; the MSI appends 1.0\msvc_x86_64.
          $root = @('C:\gstreamer\1.0\msvc_x86_64', "$env:ProgramFiles\gstreamer\1.0\msvc_x86_64") |
            Where-Object { Test-Path (Join-Path $_ 'bin\gstreamer-1.0-0.dll') } | Select-Object -First 1
          if (-not $root) {
            Get-ChildItem 'C:\gstreamer', "$env:ProgramFiles\gstreamer" -Recurse -Depth 3 -Filter 'gstreamer-1.0-0.dll' -ErrorAction SilentlyContinue | ForEach-Object FullName
            throw 'GStreamer was installed, but bin\gstreamer-1.0-0.dll was not found in the expected locations.'
          }
          Write-Host "GStreamer root: $root"
          # Windows PowerShell 5.1 '>>' writes UTF-16; GITHUB_ENV must be UTF-8.
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: GStreamer installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-install-logs
          path: ${{ runner.temp }}/gstreamer-logs
          if-no-files-found: ignore
      - name: Rust MSVC
        id: rust
        shell: powershell
        run: |
          rustup update stable
          if ($LASTEXITCODE) { throw 'rustup failed' }
          rustup default stable
          if ($LASTEXITCODE) { throw 'rustup default failed' }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'rustup target failed' }
          $release = rustc -V
          if ($LASTEXITCODE) { throw 'rustc failed' }
          "version=$($release -replace '[^0-9A-Za-z.]+','-')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache Cargo downloads and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-${{ steps.rust.outputs.version }}-gst${{ env.GSTREAMER_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-${{ steps.rust.outputs.version }}-gst${{ env.GSTREAMER_VERSION }}-
      - name: Packaging regression tests (Windows PowerShell 5.1 and PowerShell 7)
        shell: powershell
        run: |
          ./scripts/windows/test-packaging.ps1
          pwsh -NoProfile -File ./scripts/windows/test-packaging.ps1
          if ($LASTEXITCODE) { throw "pwsh tests failed: $LASTEXITCODE" }
      - name: Build, package and validate extracted ZIP
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Subdisc-Windows-x64-portable
          path: |
            dist/Subdisc-Windows-x64-portable.zip
            dist/portable-validation.json
          if-no-files-found: error
      - name: Failure report and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-failure
          path: |
            dist/portable-failure.json
            dist/portable-test-logs
          if-no-files-found: ignore
      - name: Rust tests against the installed SDK (development mode)
        shell: powershell
        run: |
          $root = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $env:PATH = "$root\bin;$env:PATH"
          $env:PKG_CONFIG = "$root\bin\pkg-config.exe"
          $env:PKG_CONFIG_PATH = "$root\lib\pkgconfig"
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "cargo test failed: $LASTEXITCODE" }

  release:
    # Only after every build, packaging and test step above passed.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Subdisc-Windows-x64-portable
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum Subdisc-Windows-x64-portable.zip > SHA256SUMS.txt
          files=(Subdisc-Windows-x64-portable.zip portable-validation.json SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Subdisc $TAG (Windows x64 portátil)" --generate-notes
          fi

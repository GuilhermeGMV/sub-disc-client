[package]
name = "subdisc-client"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "=0.36.2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
futures-util = "0.3"
libc = "0.2"
livekit = { version = "=0.9.3", features = ["rustls-tls-webpki-roots"] }
log = "0.4"
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native", "decoding"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "connect"] }

# No Wayland o seletor de tela do portal precisa de um main loop GLib.
[target.'cfg(target_os = "linux")'.dependencies]
livekit = { version = "=0.9.3", features = ["glib-main-loop"] }

# Áudio do compartilhamento: WASAPI process loopback. Mesmas versões que o
# eframe/winit já trazem no Cargo.lock; `windows-core` é exigido pelo #[implement].
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "=0.62.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Extensão mínima de SetVolume da fonte remota; versões originais preservadas.
[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc" }
webrtc-sys = { path = "vendor/webrtc-sys" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package]
name = "subdisc-client"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "=0.36.2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
futures-util = "0.3"
libc = "0.2"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
gstreamer-webrtc = "0.24"
gstreamer-sdp = "0.24"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }

log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "connect"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true


[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

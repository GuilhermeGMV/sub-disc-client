[package]
name = "subdisc-client"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "=0.36.2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
futures-util = "0.3"
libc = "0.2"
livekit = { version = "=0.9.3", features = ["rustls-tls-webpki-roots"] }
log = "0.4"
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native", "decoding"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "connect"] }

# No Wayland o seletor de tela do portal precisa de um main loop GLib.
[target.'cfg(target_os = "linux")'.dependencies]
livekit = { version = "=0.9.3", features = ["glib-main-loop"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Extensão mínima de SetVolume da fonte remota; versões originais preservadas.
[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc" }
webrtc-sys = { path = "vendor/webrtc-sys" }
